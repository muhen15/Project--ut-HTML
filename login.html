<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login SITTA UT</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: linear-gradient(to right, #003366, #0059b3);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* LOGIN BOX */
.login-box {
  background: white;
  width: 350px;
  padding: 30px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  transition: 0.3s;
}

/* 🔥 ANIMASI SHAKE */
.shake {
  animation: shake 0.4s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-8px); }
  100% { transform: translateX(0); }
}

.logo {
  width: 80px;
  margin-bottom: 10px;
}

h2 {
  margin: 10px 0;
  color: #003366;
}

.subtitle {
  font-size: 12px;
  color: gray;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 10px;
  background: #003366;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 10px;
}

button:hover {
  background: #0059b3;
}

/* LINK */
.link {
  font-size: 12px;
  color: #0059b3;
  cursor: pointer;
  margin-top: 10px;
  display: block;
}

/* ================= MODAL ================= */
.modal {
  display: none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 300px;
  text-align: center;
}
</style>

</head>

<body>

<div class="login-box" id="loginBox">
  <img src="assets/img/logo-ut.png" class="logo">

  <h2>SITTA UT</h2>
  <p class="subtitle">Sistem Informasi</p>

  <input type="email" id="email" placeholder="Email UT">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Masuk</button>

  <span class="link" onclick="openModal('lupaModal')">Lupa Password?</span>
  <span class="link" onclick="openModal('daftarModal')">Daftar</span>

  <p style="font-size:12px;color:gray;margin-top:10px;">
    © 2026 Universitas Terbuka
  </p>
</div>

<!-- ================= MODAL LUPA PASSWORD ================= -->
<div class="modal" id="lupaModal">
  <div class="modal-content">
    <h3>Lupa Password</h3>
    <p>Silakan hubungi admin UPBJJ UT untuk reset password.</p>
    <button onclick="closeModal('lupaModal')">Tutup</button>
  </div>
</div>

<!-- ================= MODAL DAFTAR ================= -->
<div class="modal" id="daftarModal">
  <div class="modal-content">
    <h3>Daftar Akun</h3>
    <input placeholder="Nama">
    <input placeholder="Email UT">
    <input placeholder="Password">
    <button onclick="alert('Pendaftaran berhasil (demo)')">Daftar</button>
    <button onclick="closeModal('daftarModal')">Tutup</button>
  </div>
</div>

<script src="js/data.js"></script>

<script>

/* ================= MODAL ================= */
function openModal(id){
  document.getElementById(id).style.display = "flex";
}

function closeModal(id){
  document.getElementById(id).style.display = "none";
}

/* 🔥 SHAKE EFFECT */
function shakeBox() {
  let box = document.getElementById("loginBox");
  box.classList.add("shake");

  setTimeout(() => {
    box.classList.remove("shake");
  }, 500);
}

/* ================= LOGIN ================= */
function login() {
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Email dan password wajib diisi!");
    shakeBox();
    return;
  }

  if (!email.endsWith("@ut.ac.id")) {
    alert("Gunakan email resmi UT!");
    shakeBox();
    return;
  }

  var user = dataPengguna.find(
    u => u.email === email && u.password === password
  );

  if (user) {
    localStorage.setItem("userLogin", JSON.stringify(user));

    alert("Login berhasil, " + user.nama);

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1000);

  } else {
    alert("email/password yang anda masukkan salah");
    shakeBox();
  }
}

</script>

</body>
</html>
